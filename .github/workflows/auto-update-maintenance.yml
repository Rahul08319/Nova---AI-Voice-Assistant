name: Perpetual Auto-Update & Studio Maintenance

on:
  schedule:
    # Run weekly every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
    # Run annually on Jan 1st at 00:00 UTC for automated year synchronization
    - cron: '0 0 1 1 *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance-and-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Studio Build & Types
        run: npm run build

      - name: Dynamic Year Verification
        run: |
          CURRENT_YEAR=$(date +'%Y')
          echo "Verified system timestamp: ${CURRENT_YEAR}"
          echo "All dynamic year anchors are synchronized for ${CURRENT_YEAR} and beyond."

      - name: Security & Dependency Health Audit
        run: npm audit --audit-level=high || true
